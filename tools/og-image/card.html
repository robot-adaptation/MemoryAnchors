<!doctype html>
<!--
  Source for assets/og-image-vN.png — the 1200x630 social preview card.

  Rendered to PNG by ./build.sh (headless Chrome screenshot). Nothing links to
  this file from the site; it exists so the card can be regenerated instead of
  re-drawn by hand.

  The numbers below are not arbitrary: they were fitted so the rendered PNG
  matches the original hand-made card to within a few pixels on every text
  block. Colors are the day-theme tokens from css/style.css resolved to
  literals (a screenshot cannot read CSS variables from another file):

    #e9f5f7           --bg            page ground
    #0b2027           --fg            title ink
    #4b7466           --primary       accent: "Anchors", anchor glyph, base bar
    rgba(11,32,39,.78) --fg-muted     authors
    rgba(11,32,39,.60) --fg-dim       affiliations
    rgba(11,32,39,.42) --fg-faint     eyebrow

  If the site's palette changes, update these to match.

  The eyebrow is IBM Plex Serif like .eyebrow on the page, but at 22px/.05em
  rather than the page's 11px/.08em, and without text-transform: uppercase so
  "CoRL" keeps its capitalization (the page does the same via .eyebrow--exact).

  The anchor glyph is inlined rather than pulled from assets/anchor.svg so it
  can take a fill color; index.html inlines the same path for the nav brand.
-->
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- display=block, not swap: a swap would let the screenshot fire while the
     fallback face is still showing and silently produce a wrong card -->
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:wght@400;500;600&display=block" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;}
  body{width:1200px;height:630px;background:#e9f5f7;color:#0b2027;
       font-family:"IBM Plex Sans",sans-serif;-webkit-font-smoothing:antialiased;
       position:relative;overflow:hidden;}
  /* everything is absolutely positioned off a 92px left margin: the tops are
     fitted values, so normal flow would drift them as soon as a font metric
     changed */
  .pad{position:absolute;left:92px;top:0;right:92px;}
  .eyebrow{display:flex;align-items:center;gap:14px;position:absolute;top:142px;
           font-family:"IBM Plex Serif",serif;font-size:22px;font-weight:400;
           letter-spacing:.05em;color:rgba(11,32,39,.42);}
  .eyebrow svg{width:30px;height:auto;fill:#4b7466;flex:none;}
  /* nowrap: the title breaks where the <br> says it does, never where the
     1016px content box happens to run out */
  h1{white-space:nowrap;position:absolute;top:213px;margin:0;font-size:75px;font-weight:700;
     line-height:81px;letter-spacing:-.02em;}
  .mark{color:#4b7466;}
  .authors{position:absolute;top:410px;margin:0;font-size:26px;font-weight:400;
           color:rgba(11,32,39,.78);}
  .affils{position:absolute;top:459px;margin:0;font-size:22px;font-weight:400;
          color:rgba(11,32,39,.60);}
  .bar{position:absolute;left:0;right:0;bottom:0;height:10px;background:#4b7466;}
</style></head>
<body>
<div class="pad">
  <div class="eyebrow">

  <p class="authors">Maximilian Du, Zhanyi Sun, Chen Xu, Paarth Shah, Masha Itkina, Shuran Song</p>

</div>
